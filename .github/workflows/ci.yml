name: CI

on:
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - "**/*.el"
      - "scripts/**"
      - ".github/workflows/**"
      - "snippets/**"
  pull_request:
    branches: [master]
    paths:
      - "**/*.md"
      - "**/*.el"
      - "scripts/**"
      - ".github/workflows/**"
      - "snippets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      shell: ${{ steps.classify.outputs.shell }}
      elisp: ${{ steps.classify.outputs.elisp }}
      scripts: ${{ steps.classify.outputs.scripts }}
      workflow: ${{ steps.classify.outputs.workflow }}
      elisp_files: ${{ steps.classify.outputs.elisp_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          elif [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --root --no-commit-id --name-only -r HEAD > changed-files.txt
          else
            git diff --name-only "$BEFORE..HEAD" > changed-files.txt
          fi

          docs=false
          shell=false
          elisp=false
          scripts=false
          workflow=false
          while IFS= read -r path; do
            case "$path" in
              *.md) docs=true ;;
            esac
            case "$path" in
              snippets/*) docs=true ;;
            esac
            case "$path" in
              scripts/*.sh) shell=true ;;
            esac
            case "$path" in
              *.el) elisp=true ;;
            esac
            case "$path" in
              scripts/*) scripts=true ;;
            esac
            case "$path" in
              .github/workflows/*)
                docs=true
                shell=true
                elisp=true
                scripts=true
                workflow=true
                ;;
            esac
          done < changed-files.txt

          {
            echo "docs=$docs"
            echo "shell=$shell"
            echo "elisp=$elisp"
            echo "scripts=$scripts"
            echo "workflow=$workflow"
            if [[ "$workflow" == "true" ]]; then
              elisp_files=$(git ls-files '*.el' | base64 -w0)
            else
              elisp_files=$(awk '/[.]el$/' changed-files.txt | base64 -w0)
            fi
            echo "elisp_files=$elisp_files"
          } >>"$GITHUB_OUTPUT"

  docs-and-contracts:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python lint tools
        if: needs.changes.outputs.scripts == 'true'
        run: python3 -m pip install --disable-pip-version-check ruff==0.15.16 mypy==2.4.1 types-PyYAML
      - name: Install Prettier
        if: needs.changes.outputs.docs == 'true'
        run: npm install -g --no-audit --no-fund prettier@3.10.1
      - name: Compile Python scripts
        if: needs.changes.outputs.scripts == 'true'
        run: python3 -m compileall -q scripts
      - name: Ruff check
        if: needs.changes.outputs.scripts == 'true'
        run: ruff check scripts/
      - name: Ruff format check
        if: needs.changes.outputs.scripts == 'true'
        run: ruff format --check scripts/
      - name: Mypy
        if: needs.changes.outputs.scripts == 'true'
        run: mypy scripts/
      - name: Validate documentation
        run: bash scripts/check-stale-patterns.sh
      - name: Prettier check Markdown
        if: needs.changes.outputs.docs == 'true'
        run: prettier --check "**/*.md"
      - name: Run offline contracts
        if: needs.changes.outputs.scripts == 'true'
        run: bash scripts/run-offline-contracts.sh

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  elisp:
    needs: changes
    if: needs.changes.outputs.elisp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Check changed Elisp parentheses
        env:
          ELISP_FILES: ${{ needs.changes.outputs.elisp_files }}
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s' "$ELISP_FILES" | base64 --decode)
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            emacs --batch "$file" \
              --eval '(progn (check-parens) (message "check-parens OK"))'
          done
